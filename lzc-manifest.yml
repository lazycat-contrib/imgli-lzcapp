application:
  subdomain: imgli
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://imgli:8686/

services:
  imgli:
    image: ghcr.1ms.run/yixian-huang/imgli:v0.9.6
    environment:
      IMGLI_LISTEN: ":8686"
      IMGLI_BASE_URL: '{{if .U.public_base_url}}{{.U.public_base_url}}{{else}}https://{{.S.AppDomain}}{{end}}'
      IMGLI_DATA_DIR: /data
      IMGLI_TRUST_PROXY: "true"
    binds:
      - /lzcapp/var/data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8686/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
