version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/community.lazycat.app.imgli.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: imgli

build:
  toolchains: []
  run_buildscript: false

images:
  - id: imgli
    target: service
    service: imgli
    source: ghcr.io/yixian-huang/imgli
    channel: stable
    delivery:
      mode: mirror
      image_template: ghcr.1ms.run/yixian-huang/imgli:{tag}
      require_digest_match: true

stores:
  official:
    enabled: false
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: imgli
    summary: "Self-hosted image hosting for LazyCat."
